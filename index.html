<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>සිංහල ශබ්දකෝෂය</title>
<link rel="icon" href="images/myicon.png" type="image/png">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Tiro+Sinhala&family=Noto+Sans+Sinhala:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<style id="pageStyle"></style>
<style>
  :root{
    --bg:#F5F1E6; --surface:#FFFFFF; --surface-soft:#FBF8EF;
    --ink:#202B1D; --muted:#707963; --line:#E4DEC9;
    --pine:#1E3B24; --pine-light:#33553B; --pine-soft:#E9EEE3;
    --gold:#B9812C; --gold-soft:#F2E2BB; --danger:#A53A3A;
    --radius:12px;
  }
  *{ box-sizing:border-box; }
  body{
    margin:0; background:var(--bg); color:var(--ink);
    font-family:'Noto Sans Sinhala','Segoe UI',Tahoma,sans-serif; line-height:1.55;
  }
  h1,h2,h3{ font-family:'Tiro Sinhala','Noto Serif Sinhala',Georgia,serif; font-weight:400; margin:0; }
  button{ font-family:inherit; cursor:pointer; }
  #printArea{ display:none; }

  /* ---------- top bar ---------- */
  .topbar{ background:var(--pine); color:#F4F1E4; padding:18px 28px; }
  .topbar-inner{ display:flex; flex-wrap:wrap; align-items:center; gap:16px; justify-content:space-between; }
  .topbar h1{ font-size:clamp(22px,2.6vw,28px); }
  .topbar p{ margin:2px 0 0; color:#B9C6B2; font-size:13px; }
  .search{ position:relative; flex:1; min-width:240px; max-width:520px; }
  .search input{
    width:100%; padding:12px 14px 12px 40px; border-radius:9px;
    border:1px solid var(--pine-light); background:#173318; color:#F4F1E4;
    font-size:15px; font-family:inherit;
  }
  .search input::placeholder{ color:#AEBBA6; }
  .search input:focus{ outline:2px solid var(--gold); outline-offset:1px; }
  .search svg{ position:absolute; left:13px; top:50%; transform:translateY(-50%); width:16px; height:16px; stroke:#AEBBA6; }
  .top-actions{ display:flex; gap:8px; flex-wrap:wrap; }

  .btn{
    border:1px solid var(--pine); background:var(--pine); color:#F4F1E4;
    padding:10px 16px; border-radius:9px; font-size:14px; font-weight:500;
  }
  .btn:hover{ background:var(--pine-light); }
  .btn.gold{ background:var(--gold); border-color:var(--gold); color:#fff; }
  .btn.gold:hover{ background:#a17124; }
  .btn.ghost{ background:transparent; color:#E2E8DA; border-color:var(--pine-light); }
  .btn.ghost:hover{ background:var(--pine-light); }
  .btn.light{ background:var(--surface); color:var(--pine); border-color:var(--line); }
  .btn.light:hover{ background:var(--pine-soft); }

  /* ---------- layout ---------- */
  .wrap{ padding:0 28px 60px; width:100%; }
  .strip{
    position:sticky; top:0; z-index:5; background:var(--bg);
    display:flex; flex-wrap:wrap; gap:5px; align-items:center;
    padding:14px 0 12px; border-bottom:1px solid var(--line); margin-bottom:18px;
  }
  .lt{
    min-width:32px; height:32px; border:1px solid var(--line); background:var(--surface);
    color:var(--pine); border-radius:8px; font-size:13.5px; font-weight:600;
  }
  .lt:hover:not(:disabled){ background:var(--gold-soft); border-color:var(--gold); }
  .lt:disabled{ color:#C3BDA6; background:transparent; border-style:dashed; cursor:default; }
  .status{ margin-left:auto; color:var(--muted); font-size:13px; padding-left:12px; }

  .letter{ margin-bottom:28px; scroll-margin-top:70px; }
  .letter > h2{
    font-size:26px; color:var(--pine); display:flex; align-items:center; gap:12px; margin-bottom:12px;
  }
  .letter > h2::after{ content:""; flex:1; height:1px; background:var(--line); }
  .grid{ display:grid; grid-template-columns:repeat(auto-fill, minmax(340px, 1fr)); gap:16px; }

  .card{
    background:var(--surface); border:1px solid var(--line); border-top:4px solid var(--pine);
    border-radius:var(--radius); padding:16px; display:flex; flex-direction:column; gap:10px; min-width:0;
  }
  .card-head{ display:flex; align-items:center; gap:8px; }
  .card h3{ font-size:24px; color:var(--pine); flex:1; overflow-wrap:anywhere; }
  .speak{
    border:1px solid var(--line); background:var(--surface-soft); border-radius:8px;
    width:34px; height:32px; font-size:15px;
  }
  .speak:hover{ background:var(--gold-soft); }
  .lbl{ font-size:11.5px; letter-spacing:.3px; color:var(--muted); font-weight:600; margin-bottom:2px; }
  .meaning{ font-size:15px; white-space:pre-wrap; overflow-wrap:anywhere; }
  .sinhala{
    background:var(--gold-soft); border-left:3px solid var(--gold); border-radius:6px;
    padding:8px 11px; font-size:14.5px; color:#4A3410; white-space:pre-wrap; overflow-wrap:anywhere;
  }
  .sinhala .lbl{ color:#7A5A22; }
  .examples{ margin:0; padding:0; list-style:none; display:flex; flex-direction:column; gap:5px; }
  .examples li{
    font-size:14px; color:#39432F; padding:6px 10px; background:var(--surface-soft);
    border:1px solid var(--line); border-radius:8px; overflow-wrap:anywhere;
  }
  .card-foot{ margin-top:auto; padding-top:10px; border-top:1px dashed var(--line); display:flex; gap:6px; }
  .owner{ font-size:12px; color:var(--muted); overflow-wrap:anywhere; }
  .card .owner:first-of-type{ margin-top:auto; }
  .card-foot + .owner{ margin-top:0; }
  .sbtn{
    border:1px solid var(--line); background:var(--surface-soft); color:var(--pine);
    padding:6px 12px; border-radius:8px; font-size:12.5px;
  }
  .sbtn:hover{ background:var(--pine-soft); }
  .sbtn.del:hover{ color:var(--danger); border-color:#E3B9B9; background:#FBEDED; }
  .empty{
    text-align:center; color:var(--muted); padding:60px 10px; border:1px dashed var(--line);
    border-radius:var(--radius); background:var(--surface-soft);
  }

  /* ---------- search popup (centre of the screen) ---------- */
  .sr{
    position:fixed; inset:0; z-index:40; display:none; align-items:center; justify-content:center;
    background:rgba(20,35,20,.45); padding:16px;
  }
  .sr.open{ display:flex; }
  .sr-panel{
    width:min(720px,100%); max-height:82vh; background:var(--bg); border-radius:14px;
    box-shadow:0 20px 60px rgba(20,35,20,.4); display:flex; flex-direction:column; overflow:hidden;
  }
  .sr-head{
    background:var(--pine); color:#F4F1E4; padding:12px 16px;
    display:flex; align-items:center; justify-content:space-between; gap:10px;
  }
  .sr-body{ overflow:auto; padding:14px; display:flex; flex-direction:column; gap:12px; }
  .sr-body .empty{ padding:30px 10px; }

  /* ---------- dialog ---------- */
  dialog{
    border:none; border-radius:14px; padding:0; width:min(640px, 94vw);
    box-shadow:0 20px 60px rgba(20,35,20,.35); background:var(--surface); color:var(--ink);
  }
  dialog::backdrop{ background:rgba(20,35,20,.45); }
  .dlg-head{ background:var(--pine); color:#F4F1E4; padding:16px 20px; }
  .dlg-head h2{ font-size:20px; }
  form.dlg{ padding:18px 20px 20px; display:flex; flex-direction:column; gap:14px; }
  form.dlg label{ font-size:13px; color:var(--muted); display:flex; flex-direction:column; gap:5px; }
  form.dlg input, form.dlg textarea{
    padding:11px 12px; border:1px solid var(--line); border-radius:8px;
    font-family:inherit; font-size:15px; color:var(--ink); background:var(--surface-soft);
  }
  form.dlg textarea{ resize:vertical; }
  form.dlg input:focus, form.dlg textarea:focus{ outline:2px solid var(--gold); outline-offset:1px; }
  .dlg-actions{ display:flex; gap:8px; justify-content:flex-end; align-items:center; flex-wrap:wrap; }
  .warn{ display:none; white-space:pre-wrap; overflow-wrap:anywhere; background:var(--gold-soft);
    border:1px solid #E5CE94; border-left:4px solid var(--gold); color:#4A3410; border-radius:8px;
    padding:9px 12px; font-size:13.5px; }
  .dlg-msg{ margin-right:auto; color:var(--pine-light); font-size:13px; }

  /* ---------- login / banner / toast ---------- */
  .login{
    position:fixed; inset:0; z-index:50; background:var(--bg);
    display:flex; align-items:center; justify-content:center; padding:20px;
  }
  .login.hidden{ display:none; }
  .login-card{
    width:min(380px, 100%); background:var(--surface); border:1px solid var(--line);
    border-top:5px solid var(--pine); border-radius:14px; padding:26px 24px;
    display:flex; flex-direction:column; gap:12px;
  }
  .login-card h1{ font-size:24px; color:var(--pine); }
  .login-card p{ margin:0 0 4px; color:var(--muted); font-size:13.5px; }
  .login-card input{
    padding:12px; border:1px solid var(--line); border-radius:8px; font-family:inherit;
    font-size:15px; background:var(--surface-soft);
  }
  .login-card input:focus{ outline:2px solid var(--gold); outline-offset:1px; }
  .login-msg{ min-height:18px; font-size:13px; color:var(--danger); }
  .pendingAdmin{
    display:none; background:var(--surface); border:1px solid var(--line); border-top:4px solid var(--gold);
    border-radius:12px; padding:14px 16px; margin:14px 0 0;
  }
  .pendingAdmin.show{ display:block; }
  .pendingAdmin h3{ font-size:15.5px; color:var(--pine); margin-bottom:10px; font-weight:600; font-family:inherit; }
  .pendingAdmin ul{ margin:0; padding:0; list-style:none; display:flex; flex-direction:column; gap:8px; }
  .pendingAdmin li{
    display:flex; align-items:center; gap:10px; flex-wrap:wrap;
    background:var(--surface-soft); border:1px solid var(--line); border-radius:9px; padding:9px 12px;
  }
  .pendingAdmin .pw{ font-weight:600; color:var(--pine); flex:1; min-width:140px; overflow-wrap:anywhere; font-size:15px; }
  .pendingAdmin .pmeta{ font-size:12px; color:var(--muted); white-space:nowrap; }
  .pendingAdmin .padd{
    border:1px solid var(--gold); background:var(--gold); color:#fff; padding:7px 13px;
    border-radius:8px; font-size:13px; font-weight:500;
  }
  .pendingAdmin .padd:hover{ background:#a17124; }
  .banner{
    display:none; align-items:center; gap:10px; flex-wrap:wrap;
    background:var(--gold-soft); border:1px solid #E5CE94; color:#4A3410;
    border-radius:10px; padding:10px 14px; margin:14px 0 0; font-size:14px;
  }
  .banner span{ flex:1; min-width:200px; }
  .banner.err{ background:#FBEDED; border-color:#E3B9B9; color:#7A2B2B; }
  .banner .btn{ padding:7px 14px; }
  .toast{
    position:fixed; left:50%; bottom:24px; transform:translateX(-50%) translateY(20px);
    background:var(--pine); color:#F4F1E4; padding:11px 18px; border-radius:10px; font-size:14px;
    opacity:0; pointer-events:none; transition:opacity .2s, transform .2s; z-index:60; max-width:90vw;
  }
  .toast.show{ opacity:1; transform:translateX(-50%) translateY(0); }
  .toast.err{ background:var(--danger); }
  .btn:disabled{ opacity:.6; cursor:default; }

  @media (max-width:640px){
    .wrap{ padding:0 14px 50px; }
    .topbar{ padding:14px; }
    .grid{ grid-template-columns:1fr; }
    .status{ margin-left:0; width:100%; padding-left:0; }
  }

  /* ---------- PRINT (PDF) layout, modelled on the plan ---------- */
  @media print{
    html, body{ background:#fff !important; height:auto !important; overflow:visible !important; }
    .app, .login, .toast, .sr{ display:none !important; }
    #printArea{
      display:block; color:#000; font-family:'Times New Roman','Noto Serif Sinhala','Noto Sans Sinhala',serif;
      font-size:11pt; line-height:1.35; width:100%;
    }
    .p-letter{
      font-size:13pt; font-weight:700; margin:12pt 0 5pt; padding-bottom:2pt;
      border-bottom:0.6pt solid #999; break-after:avoid; page-break-after:avoid;
    }
    .p-entry{ break-inside:avoid; page-break-inside:avoid; margin-bottom:10pt; overflow-wrap:anywhere; word-break:break-word; }
    .p-word{ font-size:13pt; font-weight:700; }
    .p-line{ white-space:pre-wrap; }
    .p-sin{ font-family:'Noto Sans Sinhala','Iskoola Pota','Nirmala UI',sans-serif; font-size:10.5pt; }
    .p-ex{ margin:0 0 0 30pt; padding:0; list-style:none; }
  }
</style>
</head>
<body>

<div class="app">
  <header class="topbar">
    <div class="topbar-inner">
      <div>
        <h1>සිංහල ශබ්දකෝෂය</h1>
        <p>සිංහල – සිංහල ශබ්දකෝෂය · කණ්ඩායමක් ලෙස එක්ව ගොඩනඟමු</p>
      </div>
      <div class="search">
        <svg viewBox="0 0 24 24" fill="none"><circle cx="11" cy="11" r="7" stroke="currentColor" stroke-width="2"/><path d="M20 20L16.5 16.5" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
        <input id="q" type="text" placeholder="වචනයක්, අර්ථයක් හෝ උදාහරණයක් සොයන්න...">
      </div>
      <div class="top-actions">
        <button class="btn gold" id="addBtn">+ අලුත් වචනයක්</button>
        <button class="btn ghost" id="pdfBtn" title="Print window එකේ Destination = Save as PDF තෝරන්න">PDF</button>
        <button class="btn ghost" id="xlsBtn">Excel</button>
        <button class="btn ghost" id="backupBtn" title="සියලු දත්ත JSON ගොනුවකට save කරන්න">Backup</button>
        <button class="btn ghost" id="restoreBtn" title="Backup ගොනුවක් නැවත ගන්න">Restore</button>
        <input type="file" id="restoreFile" accept=".json,application/json" hidden>
        <button class="btn ghost" id="logoutBtn">Logout</button>
      </div>
    </div>
  </header>

  <div class="wrap">
    <div class="pendingAdmin" id="pendingAdmin"></div>
    <div class="banner" id="migrate">
      <span id="migrateText"></span>
      <button class="btn" id="migrateBtn">Supabase වෙත upload කරන්න</button>
      <button class="btn light" id="migrateHide">පසුව</button>
    </div>
    <div class="banner err" id="loadErr"></div>
    <div class="strip" id="strip"></div>
    <div id="list"></div>
  </div>
</div>

<div id="printArea"></div>

<div class="login" id="login">
  <form class="login-card" id="loginForm">
    <h1>සිංහල ශබ්දකෝෂය</h1>
    <p>ඔබේ දත්ත බැලීමට Login වන්න</p>
    <input id="lEmail" type="email" required autocomplete="username" placeholder="Email">
    <input id="lPass" type="password" required autocomplete="current-password" placeholder="Password">
    <div class="login-msg" id="loginMsg"></div>
    <button class="btn" type="submit" id="loginBtn">Login</button>
  </form>
</div>

<div class="sr" id="sr">
  <div class="sr-panel">
    <div class="sr-head">
      <span id="srTitle"></span>
      <button class="btn ghost" id="srClose" type="button">✕ වසන්න</button>
    </div>
    <div class="sr-body" id="srBody"></div>
  </div>
</div>

<div class="toast" id="toast"></div>

<dialog id="dlg">
  <div class="dlg-head"><h2 id="dlgTitle">අලුත් වචනයක්</h2></div>
  <form class="dlg" id="form" method="dialog">
    <label>වචනය
      <input id="fWord" type="text" required maxlength="120" autocomplete="off" placeholder="උදා: අම්මා">
      <div class="warn" id="fWarn"></div>
    </label>
    <label>අර්ථය (සිංහලෙන්)
      <textarea id="fMeaning" rows="3" required placeholder="දරුවෙකු ප්‍රසූත කළ හෝ රැකබලා ගන්නා ස්ත්‍රිය"></textarea>
    </label>
    <label>Examples (එක් පේළියකට එක් උදාහරණයක්)
      <textarea id="fExamples" rows="4" placeholder="අම්මා අපට කැවිලි හැදුවා.&#10;අම්මාගේ ආදරය අගනේය."></textarea>
    </label>
    <label>පර්යාය පද / සටහන (අවශ්‍ය නම් පමණි)
      <textarea id="fSinhala" rows="2" placeholder="උදා: මව, ජනක"></textarea>
    </label>
    <div class="dlg-actions">
      <span class="dlg-msg" id="dlgMsg"></span>
      <button type="button" class="btn light" id="cancelBtn">වසන්න</button>
      <button type="button" class="btn light" id="nextBtn">Save &amp; ඊළඟ වචනය</button>
      <button type="submit" class="btn">Save</button>
    </div>
  </form>
</dialog>

<script>
/* ===== change these two lines to change the PDF header / footer text ===== */
const DOC_TITLE = 'සිංහල ශබ්දකෝෂය';
const OWNER     = 'Amila Udawattha';

/* ===== Supabase (the anon key is public by design; the database rules
         let every logged-in member read all words, but change only their own) ===== */
const SUPABASE_URL      = 'https://jcijglwpkfluyzrltimk.supabase.co';
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImpjaWpnbHdwa2ZsdXl6cmx0aW1rIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjY4MzU3OTUsImV4cCI6MjA4MjQxMTc5NX0.dvT8OiyVEiYn_DhkMakmSq1Vvr4REDr0kYPnyqCtWHs';

const LEGACY_KEY   = 'sinhala_dict_legacy_v1';          // words saved by the old browser-only version
const CACHE_KEY    = 'sinhala_dict_cache_v1';    // last copy downloaded from Supabase (for a fast start)
let cloudOk = false;         // true after the last successful download from Supabase
let migrateHidden = false;   // "පසුව" hides the upload banner only until the page is reloaded

let entries = [];
let editingId = null;
let sb = null;
let session = null;

const $ = id => document.getElementById(id);
const q = $('q'), dlg = $('dlg'), sr = $('sr');
const fWord = $('fWord'), fMeaning = $('fMeaning'), fExamples = $('fExamples'), fSinhala = $('fSinhala');

function el(tag, cls, text){
  const e = document.createElement(tag);
  if(cls) e.className = cls;
  if(text !== undefined) e.textContent = text;
  return e;
}
function toast(msg, isErr){
  const t = $('toast');
  t.textContent = msg;
  t.className = 'toast show' + (isErr ? ' err' : '');
  clearTimeout(toast._t);
  toast._t = setTimeout(()=>{ t.className = 'toast'; }, isErr ? 6000 : 2500);
}
// compare words / meanings ignoring case, spaces and punctuation
function norm(s){
  return String(s || '').normalize('NFC').replace(/[\u200c\u200d]/g,'').toLowerCase()
    .replace(/[^\p{L}\p{M}\p{N}]+/gu,' ').trim();
}
// number of visible letters (vowel signs and joiners are not counted separately)
function letterCount(s){ return String(s || '').replace(/[\p{M}\u200c\u200d]/gu,'').length; }
// true when the word was added by the logged-in person
function isMine(e){ return !!(session && session.user && e.userId === session.user.id); }

/* CLOUD-START */
function rowToEntry(r){
  return { id:r.id, word:r.word, meaning:r.meaning, examples:r.examples || [],
           note:r.note || '', created:Date.parse(r.created_at) || Date.now(),
           userId:r.user_id || null, addedBy:r.added_by || '' };
}
function niceErr(error){
  if(!error) return '';
  if(error.code === '23505') return 'මේ වචනය දැනටමත් ඇත (Supabase හි unique නීතියක් ඉතිරිව ඇත — SQL ගොනුව නැවත run කරන්න).';
  return error.message || String(error);
}
function legacyEntries(){
  try{
    const a = JSON.parse(localStorage.getItem(LEGACY_KEY) || '[]');
    return Array.isArray(a) ? a.filter(x=>x && x.word && x.meaning) : [];
  }catch(e){ return []; }
}
function readCache(){
  try{ const a = JSON.parse(localStorage.getItem(CACHE_KEY) || '[]'); return Array.isArray(a) ? a : []; }
  catch(e){ return []; }
}
function writeCache(){ try{ localStorage.setItem(CACHE_KEY, JSON.stringify(entries)); }catch(e){} }
let cacheTimer = null;
function scheduleCacheWrite(){ clearTimeout(cacheTimer); cacheTimer = setTimeout(writeCache, 800); }

async function fetchAll(){
  const all = [], size = 1000;
  for(let from = 0; ; from += size){
    const { data, error } = await sb.from('sinhala_dictionary').select('*')
      .order('created_at', {ascending:true}).range(from, from + size - 1);
    if(error) throw error;
    all.push(...data);
    if(data.length < size) break;
  }
  return all.map(rowToEntry);
}

async function saveEntry(fields){
  if(editingId){
    const { data, error } = await sb.from('sinhala_dictionary').update(fields).eq('id', editingId).select().single();
    if(error) throw error;
    const i = entries.findIndex(x=>x.id === editingId);
    if(i >= 0) entries[i] = rowToEntry(data); else entries.push(rowToEntry(data));
    scheduleCacheWrite();
    render();                 // edits are occasional — a full (but now paginated) refresh is fine
  }else{
    const { data, error } = await sb.from('sinhala_dictionary')
      .insert({ ...fields, user_id:session.user.id, added_by:session.user.email }).select().single();
    if(error) throw error;
    const entry = rowToEntry(data);
    entries.push(entry);
    scheduleCacheWrite();
    insertCardLive(entry);    // avoid rebuilding the WHOLE list on every single add
    renderPendingAdmin();
  }
}

async function removeEntry(e){
  if(!isMine(e)){ toast('ඔබට මකා දැමිය හැක්කේ ඔබ ඇතුළත් කළ වචන පමණි.', true); return; }
  if(!confirm(`“${e.word}” මකා දමන්නද?`)) return;
  const { error } = await sb.from('sinhala_dictionary').delete().eq('id', e.id);
  if(error){ toast('මකන්න නොහැකි විය: ' + niceErr(error), true); return; }
  entries = entries.filter(x=>x.id !== e.id);
  scheduleCacheWrite();
  removeCardLive(e.id);
}

// adds many words at once; skips a word only if the same word AND meaning already exist; returns how many were added
async function insertMany(list){
  const have = new Set(entries.map(x=>norm(x.word) + '|' + norm(x.meaning)));
  const fresh = [];
  list.forEach(x=>{
    const w = String(x.word || '').trim().replace(/\s+/g,' ');
    const m = String(x.meaning || '').trim();
    const k = norm(w) + '|' + norm(m);
    if(w && m && w.length <= 120 && !have.has(k)){
      have.add(k);
      fresh.push({ user_id:session.user.id, added_by:session.user.email, word:w, meaning:m,
        examples:Array.isArray(x.examples) ? x.examples.map(String).map(s=>s.trim()).filter(Boolean) : [],
        note:x.note ? String(x.note) : '' });
    }
  });
  for(let i = 0; i < fresh.length; i += 200){
    const { error } = await sb.from('sinhala_dictionary').insert(fresh.slice(i, i + 200));
    if(error) throw error;
  }
  return fresh.length;
}

let pendingWords = [];
async function fetchPendingWords(){
  try{
    const { data, error } = await sb.from('pending_words').select('*').eq('lang','si').order('created_at', {ascending:true});
    if(error) throw error;
    pendingWords = data;
  }catch(e){ pendingWords = []; }

function renderPendingAdmin(){
  const box = $('pendingAdmin');
  const have = new Set(entries.map(x=>norm(x.word)));
  const seen = new Set(), visible = [];
  pendingWords.forEach(p=>{
    const k = norm(p.word);
    if(have.has(k) || seen.has(k)) return;
    seen.add(k);
    visible.push(p);

  box.innerHTML = '';
  box.appendChild(el('h3','', `පරිශීලකයන් විසින් Admin වෙත යොමු කළ වචන (${visible.length}) — අර්ථය ඇතුළත් කරන්න`));
  const ul = el('ul');
  visible.forEach(p=>{
    const li = document.createElement('li');
    li.appendChild(el('span','pw', p.word));
    const when = p.created_at ? new Date(p.created_at).toLocaleDateString('si-LK') : '';
    li.appendChild(el('span','pmeta', (p.added_by || 'නොදනී') + (when ? ' · ' + when : '')));

function today(){
  const d = new Date();
  return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
}

/* ---------- alphabetical order ---------- */
const ALPHABET = Array.from('අආඇඈඉඊඋඌඍඎඏඐඑඒඓඔඕඖකඛගඝඞඟචඡජඣඤඥඦටඨඩඪණඬතථදධනඳපඵබභමඹයරලවශෂසහළෆ');
function keyOf(w){ return String(w).normalize('NFC').replace(/^[^\p{L}\p{N}]+/u,'').trim(); }
function letterOf(w){
  const c = Array.from(keyOf(w))[0] || '';
  return ALPHABET.includes(c) ? c : '#';
}
function compareEntries(a,b){
  const idx = L => L === '#' ? 9999 : ALPHABET.indexOf(L);
  const d = idx(letterOf(a.word)) - idx(letterOf(b.word));
  if(d) return d;
  const x = keyOf(a.word), y = keyOf(b.word);
  return x < y ? -1 : (x > y ? 1 : 0);
}
function sorted(){ return entries.slice().sort(compareEntries); }

/* ---------- screen rendering ---------- */
function speak(w){
  try{ speechSynthesis.cancel(); const u = new SpeechSynthesisUtterance(w); u.lang = 'en-US'; u.rate = .9; speechSynthesis.speak(u); }
  catch(e){}
}

function card(e){

  c.dataset.id = e.id;
  const head = el('div','card-head');
  head.appendChild(el('h3','',e.word));
  c.appendChild(head);

  const m = el('div');
  m.appendChild(el('div','lbl','අර්ථය'));
  m.appendChild(el('div','meaning',e.meaning));
  c.appendChild(m);

  if(e.note){
    const s = el('div','sinhala');
    s.appendChild(el('div','lbl','පර්යාය පද / සටහන'));
    s.appendChild(document.createTextNode(e.note));
    c.appendChild(s);
  }
  if(e.examples && e.examples.length){
    const x = el('div');
    x.appendChild(el('div','lbl','උදාහරණ'));
    const ul = el('ul','examples');
    e.examples.forEach(t=>ul.appendChild(el('li','',t)));
    x.appendChild(ul);
    c.appendChild(x);
  }
  // Edit / delete only for the person who added the word
  if(isMine(e)){
    const foot = el('div','card-foot');
    const ed = el('button','sbtn','Edit'); ed.onclick = ()=>openDialog(e);
    const del = el('button','sbtn del','මකන්න'); del.onclick = ()=>removeEntry(e);
    foot.appendChild(ed); foot.appendChild(del);
    c.appendChild(foot);
  }
  // who added it
  c.appendChild(el('div','owner','✉ ' + (e.addedBy || 'නොදනී')));
  return c;
}

/* With a small dictionary, rebuilding every card on every screen update is fine.
   Once it grows into the thousands, doing that on every single "add a word" click
   freezes the tab (sometimes long enough that the browser offers to close it).
   So: render() only builds the FIRST page of cards, more pages load with the
   "තව පෙන්වන්න" button or by jumping to a letter, and adding/removing one word
   updates just that one card instead of rebuilding the whole list. */
const PAGE_SIZE = 150;
let currentShown = [];   // full sorted list behind the current view, kept in sync as entries change
let renderedCount = 0;   // how many of currentShown are actually in the DOM right now
let lastLetter = '', lastGrid = null;

function buildStrip(){
  const present = new Set(entries.map(e=>letterOf(e.word)));
  const strip = $('strip'); strip.innerHTML = '';
  ALPHABET.concat(['#']).forEach(L=>{
    const b = el('button','lt',L);
    b.disabled = !present.has(L);
    b.onclick = ()=>jumpToLetter(L);
    strip.appendChild(b);
  });
  strip.appendChild(el('span','status', `වචන ${entries.length}ක්`));
}
function updateStatusText(){
  const st = document.querySelector('#strip .status');
  if(st) st.textContent = `වචන ${entries.length}ක්`;
}
function appendNextPage(){
  const list = $('list');
  const end = Math.min(renderedCount + PAGE_SIZE, currentShown.length);
  for(let i = renderedCount; i < end; i++){
    const e = currentShown[i];
    const L = letterOf(e.word);
    if(L !== lastLetter){
      lastLetter = L;
      const sec = el('section','letter'); sec.id = 'L-' + (L === '#' ? 'other' : L);
      sec.appendChild(el('h2','',L));
      lastGrid = el('div','grid'); sec.appendChild(lastGrid);
      list.appendChild(sec);
    }
    lastGrid.appendChild(card(e));
  }
  renderedCount = end;
  updateLoadMore();
}
function updateLoadMore(){
  let btn = $('loadMoreBtn');
  const remaining = currentShown.length - renderedCount;
  if(remaining > 0){
    if(!btn){
      btn = el('button','btn light','');
      btn.id = 'loadMoreBtn'; btn.type = 'button';
      btn.style.cssText = 'display:block;margin:22px auto;';
      btn.onclick = appendNextPage;
      $('list').insertAdjacentElement('afterend', btn);
    }
    btn.textContent = `තව පෙන්වන්න (ඉතිරි ${remaining})`;
  }else if(btn){ btn.remove(); }
}
function jumpToLetter(L){
  const targetId = 'L-' + (L === '#' ? 'other' : L);
  let node = document.getElementById(targetId);
  if(!node){
    const idx = currentShown.findIndex(x => letterOf(x.word) === L);
    if(idx === -1) return;
    while(renderedCount <= idx && renderedCount < currentShown.length) appendNextPage();
    node = document.getElementById(targetId);
  }
  if(node) node.scrollIntoView({behavior:'smooth', block:'start'});
}

function render(){
  if(sr.classList.contains('open')) fillSearch();
  currentShown = sorted();
  renderedCount = 0; lastLetter = ''; lastGrid = null;
  buildStrip();
  const list = $('list'); list.innerHTML = '';
  const oldBtn = $('loadMoreBtn'); if(oldBtn) oldBtn.remove();
  if(!currentShown.length){
    list.appendChild(el('div','empty', '“+ අලුත් වචනයක්” ඔබා පළමු වචනය ඇතුළත් කරන්න.'));
    return;
  }
  appendNextPage();
}

// used after adding ONE new word — updates just that word instead of rebuilding everything
function insertCardLive(e){
  updateStatusText();
  const L = letterOf(e.word);
  $('strip').querySelectorAll('.lt').forEach(b=>{ if(b.textContent === L) b.disabled = false; });

  let idx = currentShown.findIndex(o => compareEntries(o, e) > 0);
  if(idx === -1) idx = currentShown.length;
  currentShown.splice(idx, 0, e);

  if(idx < renderedCount){
    renderedCount++;
    const sec = document.getElementById('L-' + (L === '#' ? 'other' : L));
    if(sec){
      const grid = sec.querySelector('.grid');
      const cardEl = card(e);
      const after = Array.from(grid.children).find(c=>{
        const h = c.querySelector('h3');
        return h && keyOf(h.textContent).localeCompare(keyOf(e.word), 'en') > 0;
      });
      if(after) grid.insertBefore(cardEl, after); else grid.appendChild(cardEl);
    }
    // if its letter section isn't on screen yet, the next full render() will include it
  }
  updateLoadMore();
}

// used after deleting a word — removes just that card instead of rebuilding everything
function removeCardLive(id){
  const i = currentShown.findIndex(x => x.id === id);
  if(i > -1){ currentShown.splice(i, 1); if(i < renderedCount) renderedCount--; }
  const node = document.querySelector('#list .card[data-id="' + id + '"]');
  if(node){
    const sec = node.closest('.letter');
    node.remove();
    if(sec && !sec.querySelector('.card')) sec.remove();
  }
  updateStatusText();
  updateLoadMore();
}

/* ---------- search popup (shows after the 2nd letter, centred on screen) ---------- */
function fillSearch(){
  const term = q.value.trim().toLowerCase();
  const score = e=>{
    const w = e.word.toLowerCase();
    return w.startsWith(term) ? 0 : (w.includes(term) ? 1 : 2);
  };
  const hits = currentShown
    .filter(e=>[e.word, e.meaning, e.note || '', ...(e.examples || [])].join('\n').toLowerCase().includes(term))
    .sort((a,b)=>score(a) - score(b));
  $('srTitle').textContent = `“${q.value.trim()}” — වචන ${hits.length}ක් හමුවිය`;
  const body = $('srBody'); body.innerHTML = '';
  if(!hits.length){ body.appendChild(el('div','empty','ගැළපෙන වචනයක් හමු නොවීය.')); return; }
  hits.slice(0, 50).forEach(e=>body.appendChild(card(e)));
  if(hits.length > 50) body.appendChild(el('div','empty','තවත් ප්‍රතිඵල ඇත — සෙවුම තව දිගු කරන්න.'));
}
function closeSearch(){ sr.classList.remove('open'); }
let searchTimer = null;
q.addEventListener('input', ()=>{
  if(letterCount(q.value.trim()) < 2){ closeSearch(); clearTimeout(searchTimer); return; }
  clearTimeout(searchTimer);
  searchTimer = setTimeout(()=>{ fillSearch(); sr.classList.add('open'); }, 150);
});
$('srClose').onclick = closeSearch;
sr.addEventListener('click', ev=>{ if(ev.target === sr) closeSearch(); });
document.addEventListener('keydown', ev=>{ if(ev.key === 'Escape' && !dlg.open) closeSearch(); });

/* ---------- add / edit ---------- */
function openDialog(e){
  closeSearch();
  editingId = e ? e.id : null;
  $('dlgTitle').textContent = e ? 'වචනය සංස්කරණය' : 'අලුත් වචනයක්';
  $('nextBtn').style.display = e ? 'none' : '';
  $('dlgMsg').textContent = '';
  $('fWarn').style.display = 'none';
  fWord.value = e ? e.word : '';
  fMeaning.value = e ? e.meaning : '';
  fExamples.value = e ? (e.examples || []).join('\n') : '';
  fSinhala.value = e ? (e.note || '') : '';
  dlg.showModal();
  fWord.focus();
}

let busy = false;
function setBusy(on){
  busy = on;
  dlg.querySelectorAll('button').forEach(b=>{ b.disabled = on; });
}

async function commit(){
  if(busy) return false;
  const word = fWord.value.trim().replace(/\s+/g,' ');
  const meaning = fMeaning.value.trim();
  if(!word){ fWord.focus(); return false; }
  if(!meaning){ fMeaning.focus(); return false; }

  // same word already in the shared dictionary?
  const same = entries.filter(x=>x.id !== editingId && norm(x.word) === norm(word));
  if(same.length){
    const identical = same.find(x=>norm(x.meaning) === norm(meaning));
    if(identical){
      $('dlgMsg').textContent = `“${identical.word}” මේ අර්ථයෙන්ම දැනටමත් ඇත (${identical.addedBy || 'නොදනී'}).`;
      fWord.focus();
      return false;
    }
    const lines = same.map(x=>`• ${x.meaning}  (${x.addedBy || 'නොදනී'})`).join('\n');
    if(!confirm(`“${word}” දැනටමත් ඇතුළත් කර ඇත:\n\n${lines}\n\nඔබේ අර්ථ දැක්වීම වැඩි දියුණු කළ / වෙනස් එකක් නම් ඇතුළත් කරන්නද?`)){
      return false;
    }
  }
  const fields = {
    word, meaning,
    examples: fExamples.value.split('\n').map(s=>s.trim()).filter(Boolean),
    note: fSinhala.value.trim()
  };
  setBusy(true);
  $('dlgMsg').textContent = 'Save වෙමින්...';
  try{
    await saveEntry(fields);
    $('dlgMsg').textContent = '';
    return true;
  }catch(e){
    $('dlgMsg').textContent = 'Save කළ නොහැකි විය: ' + niceErr(e);
    return false;
  }finally{
    setBusy(false);
  }
}

// as soon as the person leaves the Word box, tell them if the word already exists
function checkWord(){
  const box = $('fWarn'), w = norm(fWord.value);
  const same = w ? entries.filter(x=>x.id !== editingId && norm(x.word) === w) : [];
  if(!same.length){ box.style.display = 'none'; box.textContent = ''; return; }
  box.textContent = `⚠ “${same[0].word}” දැනටමත් ඇතුළත් කර ඇත:\n` +
    same.map(x=>`• ${x.meaning}  (${x.addedBy || 'නොදනී'})`).join('\n') +
    '\nවැඩි දියුණු කළ / වෙනස් අර්ථයක් නම් පමණක් ඇතුළත් කරන්න.';
  box.style.display = 'block';
}

});
document.addEventListener('keydown', ev=>{
  const t = document.activeElement.tagName;
  if(ev.key === '/' && t !== 'INPUT' && t !== 'TEXTAREA'){ ev.preventDefault(); q.focus(); }

function buildPrint(){
  const pa = $('printArea'); pa.innerHTML = '';
  let cur = '';
  sorted().forEach(e=>{
    const L = letterOf(e.word);
    if(L !== cur){ cur = L; pa.appendChild(el('div','p-letter',L)); }
    const box = el('div','p-entry');
    box.appendChild(el('div','p-word',e.word));
    box.appendChild(el('div','p-line','අර්ථය-' + e.meaning));
    if(e.note) box.appendChild(el('div','p-line p-sin','පර්යාය-' + e.note));
    if(e.examples && e.examples.length){
      box.appendChild(el('div','p-line','උදාහරණ'));

    }
    pa.appendChild(box);
  });
}
window.addEventListener('beforeprint', buildPrint);
// download the newest copy of ALL members' words before exporting

$('pdfBtn').onclick = async ()=>{

/* XLSX-START */
/* ---------- Excel: built in the browser, no internet / library needed ---------- */
const CRC_TABLE = (()=>{ const t = new Uint32Array(256); for(let n=0;n<256;n++){ let c=n; for(let k=0;k<8;k++) c = c & 1 ? 0xEDB88320 ^ (c >>> 1) : c >>> 1; t[n] = c >>> 0; } return t; })();
function crc32(buf){ let c = 0xFFFFFFFF; for(let i=0;i<buf.length;i++) c = CRC_TABLE[(c ^ buf[i]) & 0xFF] ^ (c >>> 8); return (c ^ 0xFFFFFFFF) >>> 0; }

function makeZip(files){
  const enc = new TextEncoder();
  const chunks = [], central = [];
  let offset = 0;
  files.forEach(f=>{
    const name = enc.encode(f.name), data = enc.encode(f.text);
    const crc = crc32(data), size = data.length;
    const lh = new DataView(new ArrayBuffer(30));
    lh.setUint32(0,0x04034b50,true); lh.setUint16(4,20,true); lh.setUint16(6,0x0800,true); lh.setUint16(8,0,true);
    lh.setUint16(10,0,true); lh.setUint16(12,0x21,true); lh.setUint32(14,crc,true);
    lh.setUint32(18,size,true); lh.setUint32(22,size,true); lh.setUint16(26,name.length,true); lh.setUint16(28,0,true);
    chunks.push(new Uint8Array(lh.buffer), name, data);
    const ch = new DataView(new ArrayBuffer(46));
    ch.setUint32(0,0x02014b50,true); ch.setUint16(4,20,true); ch.setUint16(6,20,true); ch.setUint16(8,0x0800,true);
    ch.setUint16(10,0,true); ch.setUint16(12,0,true); ch.setUint16(14,0x21,true); ch.setUint32(16,crc,true);
    ch.setUint32(20,size,true); ch.setUint32(24,size,true); ch.setUint16(28,name.length,true);
    ch.setUint32(42,offset,true);
    central.push(new Uint8Array(ch.buffer), name);
    offset += 30 + name.length + size;
  });
  const cdSize = central.reduce((s,c)=>s + c.length, 0);
  const end = new DataView(new ArrayBuffer(22));
  end.setUint32(0,0x06054b50,true); end.setUint16(8,files.length,true); end.setUint16(10,files.length,true);
  end.setUint32(12,cdSize,true); end.setUint32(16,offset,true);
  return new Blob([...chunks, ...central, new Uint8Array(end.buffer)],
    {type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'});
}

function xmlEsc(s){
  return String(s).replace(/[\x00-\x08\x0B\x0C\x0E-\x1F]/g,'')
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}
function cell(ref, text, style){
  return '<c r="' + ref + '" s="' + style + '" t="inlineStr"><is><t xml:space="preserve">' + xmlEsc(text) + '</t></is></c>';
}

function buildXlsx(list){
  const head = ['No.', 'වචනය', 'අර්ථය', 'පර්යාය පද / සටහන', 'උදාහරණ'];
  const cols = 'ABCDE';
  let rows = '<row r="1" ht="24" customHeight="1">' + head.map((h,i)=>cell(cols[i] + '1', h, 1)).join('') + '</row>';
  list.forEach((e,i)=>{
    const r = i + 2;
    const vals = [String(i + 1), e.word, e.meaning, e.note || '', (e.examples || []).join('\n')];
    rows += '<row r="' + r + '">' + vals.map((v,c)=>cell(cols[c] + r, v, 2)).join('') + '</row>';
  });
  const last = list.length + 1;
  const NS = 'http://schemas.openxmlformats.org/spreadsheetml/2006/main';
  const sheet = '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>' +
    '<worksheet xmlns="' + NS + '">' +
    '<sheetViews><sheetView workbookViewId="0"><pane ySplit="1" topLeftCell="A2" activePane="bottomLeft" state="frozen"/></sheetView></sheetViews>' +
    '<cols><col min="1" max="1" width="6" customWidth="1"/><col min="2" max="2" width="22" customWidth="1"/>' +
    '<col min="3" max="3" width="55" customWidth="1"/><col min="4" max="4" width="40" customWidth="1"/><col min="5" max="5" width="60" customWidth="1"/></cols>' +
    '<sheetData>' + rows + '</sheetData><autoFilter ref="A1:E' + last + '"/></worksheet>';
  const styles = '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>' +
    '<styleSheet xmlns="' + NS + '">' +
    '<fonts count="2"><font><sz val="11"/><name val="Calibri"/></font><font><b/><sz val="11"/><color rgb="FFFFFFFF"/><name val="Calibri"/></font></fonts>' +
    '<fills count="3"><fill><patternFill patternType="none"/></fill><fill><patternFill patternType="gray125"/></fill>' +
    '<fill><patternFill patternType="solid"><fgColor rgb="FF1E3B24"/><bgColor indexed="64"/></patternFill></fill></fills>' +
    '<borders count="1"><border><left/><right/><top/><bottom/><diagonal/></border></borders>' +
    '<cellStyleXfs count="1"><xf numFmtId="0" fontId="0" fillId="0" borderId="0"/></cellStyleXfs>' +
    '<cellXfs count="3"><xf numFmtId="0" fontId="0" fillId="0" borderId="0" xfId="0"/>' +
    '<xf numFmtId="0" fontId="1" fillId="2" borderId="0" xfId="0" applyFont="1" applyFill="1" applyAlignment="1"><alignment vertical="center"/></xf>' +
    '<xf numFmtId="0" fontId="0" fillId="0" borderId="0" xfId="0" applyAlignment="1"><alignment vertical="top" wrapText="1"/></xf></cellXfs>' +
    '<cellStyles count="1"><cellStyle name="Normal" xfId="0" builtinId="0"/></cellStyles></styleSheet>';
  const REL = 'http://schemas.openxmlformats.org/package/2006/relationships';
  const OD = 'http://schemas.openxmlformats.org/officeDocument/2006/relationships';
  return makeZip([
    { name:'[Content_Types].xml', text:'<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types"><Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/><Default Extension="xml" ContentType="application/xml"/><Override PartName="/xl/workbook.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.sheet.main+xml"/><Override PartName="/xl/worksheets/sheet1.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.worksheet+xml"/><Override PartName="/xl/styles.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.styles+xml"/></Types>' },
    { name:'_rels/.rels', text:'<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="' + REL + '"><Relationship Id="rId1" Type="' + OD + '/officeDocument" Target="xl/workbook.xml"/></Relationships>' },
    { name:'xl/workbook.xml', text:'<?xml version="1.0" encoding="UTF-8" standalone="yes"?><workbook xmlns="' + NS + '" xmlns:r="' + OD + '"><sheets><sheet name="Sinhala Dictionary" sheetId="1" r:id="rId1"/></sheets></workbook>' },
    { name:'xl/_rels/workbook.xml.rels', text:'<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="' + REL + '"><Relationship Id="rId1" Type="' + OD + '/worksheet" Target="worksheets/sheet1.xml"/><Relationship Id="rId2" Type="' + OD + '/styles" Target="styles.xml"/></Relationships>' },
    { name:'xl/styles.xml', text:styles },
    { name:'xl/worksheets/sheet1.xml', text:sheet }
  ]);
}
/* XLSX-END */

function download(blob, name){
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob); a.download = name;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(a.href), 1500);
}
$('xlsBtn').onclick = async ()=>{
  await freshAll();
  if(!entries.length){ alert('Export කිරීමට වචන කිසිවක් නැත.'); return; }
  download(buildXlsx(sorted()), 'Sinhala-Dictionary-' + today() + '.xlsx');
};

/* ---------- backup / restore ---------- */
$('backupBtn').onclick = ()=>{
  download(new Blob([JSON.stringify({entries}, null, 2)], {type:'application/json'}), 'sinhala-dictionary-backup-' + today() + '.json');
};
$('restoreBtn').onclick = ()=>$('restoreFile').click();
$('restoreFile').onchange = ev=>{
  const input = ev.target;
  const f = input.files[0]; if(!f) return;
  const r = new FileReader();
  r.onload = async ()=>{
    let incoming;
    try{
      const data = JSON.parse(r.result);
      incoming = Array.isArray(data) ? data : (data.entries || []);
    }catch(err){ alert('මේ ගොනුව කියවීමට නොහැකි විය.'); input.value = ''; return; }
    try{
      const added = await insertMany(incoming);
      await refresh();
      toast(`වචන ${added}ක් Supabase වෙත එකතු කළා.`);
    }catch(err){
      toast('Restore කළ නොහැකි විය: ' + niceErr(err), true);
      await refresh();
    }
    input.value = '';
  };
  r.readAsText(f);
};

/* ---------- move the old browser-only words into Supabase ---------- */
// The banner appears whenever this browser still holds words that Supabase does not have yet.
function updateBanner(){
  const have = new Set(entries.map(x=>norm(x.word) + '|' + norm(x.meaning)));
  const missing = legacyEntries().filter(x=>!have.has(norm(x.word) + '|' + norm(x.meaning)));
  const show = !!session && cloudOk && missing.length > 0 && !migrateHidden;
  $('migrate').style.display = show ? 'flex' : 'none';
  $('migrateText').textContent = `මෙම browser එකේ කලින් save කළ වචන ${missing.length}ක් Supabase එකේ නැත. ඒවා upload කරන්නද?`;
}
$('migrateBtn').onclick = async ()=>{
  const btn = $('migrateBtn'); btn.disabled = true;
  try{
    const added = await insertMany(legacyEntries());
    await refresh();
    toast(`වචන ${added}ක් Supabase වෙත upload කළා.`);
  }catch(err){
    toast('Upload කළ නොහැකි විය: ' + niceErr(err), true);
  }finally{ btn.disabled = false; }
};
$('migrateHide').onclick = ()=>{ migrateHidden = true; updateBanner(); };

/* ---------- login / logout ---------- */
function showLogin(msg){
  $('login').classList.remove('hidden');
  $('loginMsg').textContent = msg || '';
}
function hideLogin(){
  $('login').classList.add('hidden');
  $('logoutBtn').title = session && session.user ? 'Logout (' + session.user.email + ')' : 'Logout';
}
$('loginForm').addEventListener('submit', async ev=>{
  ev.preventDefault();
  if(!sb){ showLogin('Supabase library එක load වී නැත. Internet connection එක බලා page එක refresh කරන්න.'); return; }
  const btn = $('loginBtn'); btn.disabled = true;
  $('loginMsg').textContent = '';
  try{
    const { data, error } = await sb.auth.signInWithPassword({ email:$('lEmail').value.trim(), password:$('lPass').value });
    if(error){ $('loginMsg').textContent = error.message; return; }
    session = data.session;
    $('lPass').value = '';
    hideLogin();
    entries = [];
    render();
    await refresh();
  }catch(err){
    $('loginMsg').textContent = niceErr(err);
  }finally{ btn.disabled = false; }
});
$('logoutBtn').onclick = async ()=>{ if(sb) await sb.auth.signOut(); };

async function init(){
  render();
  if(!window.supabase){
    showLogin('Supabase library එක load වී නැත. Internet connection එක බලා page එක refresh කරන්න.');
    return;
  }
  sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
  sb.auth.onAuthStateChange((event, s)=>{
    session = s;
    if(event === 'SIGNED_OUT'){
      entries = [];
      cloudOk = false;
      closeSearch();
      $('loadErr').style.display = 'none';
      try{ localStorage.removeItem(CACHE_KEY); }catch(e){}
      render();
      updateBanner();
      showLogin('');
    }
  });
  const { data } = await sb.auth.getSession();
  session = data.session;
  if(session){
    hideLogin();
    entries = readCache();      // show the last copy instantly, then refresh from Supabase
    render();
    refresh();
  }else{
    showLogin('');
  }
}
init();
</script>
